[project]
name = "gosim-blender-agent"
version = "0.1.0"
description = "Natural-language Blender agent for editing Infinigen scenes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "requests>=2.31.0",
  "websocket-client>=1.7.0",
  "tenacity>=8.2.0",
]

[project.optional-dependencies]
ui = [
  "gradio==5.50.0",
  "gradio_modal==0.0.4",
  "modelscope_studio==1.6.1",
]
llm = [
  "anthropic>=0.8.0",
  "zhipuai>=2.0.0",
  "openai>=1.1.0",
  "volcengine-python-sdk[ark]>=0.1.0",
]

[project.scripts]
gosim-agent = "gosim_blender_agent.cli:main"
gosim-agent-ui = "app:fail_safe_main"

[tool.ruff]
line-length = 100
target-version = "py311"
